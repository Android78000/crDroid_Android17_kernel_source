name: Compile Whyred Kernel (Android 17)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Build Environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Disable Werror Globally and Fix Source Code
        run: |
          # 1. Poore kernel repository ki saari Makefiles se strict -Werror flag ko hatayein
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-Werror//g' || true
          
          # 2. Compiler ko explicitly instruction dein ki address aur format warnings ko error na banaye
          sed -i 's/KBUILD_CFLAGS   += -Wall/KBUILD_CFLAGS   += -Wall -Wno-error=address -Wno-error=format/g' Makefile || true

          # 3. F2FS printk specifier mismatch ko theek karein (jo pichla error aaya tha)
          if [ -f fs/f2fs/super.c ]; then
            sed -i 's/BLOCK_SIZE(%d)/BLOCK_SIZE(%lu)/g' fs/f2fs/super.c || sed -i 's/BLOCK_SIZE(%d)/BLOCK_SIZE(%ld)/g' fs/f2fs/super.c
          fi

      - name: Build Defconfig & Kernel
        run: |
          mkdir -p out
          echo "Listing vendor configs:"
          ls -la arch/arm64/configs/vendor/ || true
          ls -la arch/arm64/configs/vendor/xiaomi/ || true
          
          # Jo exact path ya config milegi, usse build karenge
          make O=out sdm660_defconfig || make O=out vendor/xiaomi/sdm660_defconfig
          make O=out -j$(nproc)
          
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
          
