name: Compile Whyred Kernel (Android 17)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: true
          branch: 17.0

      - name: Setup Build Environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git make bc bison flex libssl-dev libelf-dev build-essential \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Build Defconfig & Kernel
        run: |
          mkdir -p out
          make O=out whyred_defconfig
          make O=out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
          
